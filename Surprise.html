<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <title>惊喜 - LittleMimiCHEN</title>
    <style>
        /* 1. 网页全屏、居中、深灰色背景 */
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #1a1a1a; 
            display: flex;
            justify-content: center; /* 水平居中 */
            align-items: center;     /* 垂直居中 */
        }
        
        /* 2. 左上角返回按钮 */
        .back-btn {
            position: absolute;
            top: 20px;
            left: 20px;
            padding: 10px 20px;
            background: rgba(255, 255, 255, 0.2);
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-family: "Microsoft YaHei", sans-serif;
            font-weight: bold;
            backdrop-filter: blur(5px);
            z-index: 999;
        }
        
        .back-btn:hover {
            background: rgba(255, 255, 255, 0.8);
            color: black;
        }

        /* 3. 媒体样式（强制锁死大小为 200px，如果你觉得大可以改成 150px） */
        .center-media {
            width: 200px !important; 
            height: auto !important;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(255, 255, 255, 0.2);
        }
    </style>
</head>
<body>

    <!-- 返回按钮 -->
    <a href="./index.html" class="back-btn">⬅️ 返回首页</a>

    <!-- 👇👇👇 这里是核心，二选一 👇👇👇 -->

    <!-- 【选项 A】如果你用的是真正的动图，用这行 -->
    <img src="./demo.gif" class="center-media" alt="惊喜动图">

    <!-- 【选项 B】如果你用的是 MP4 视频，用这行（把上面那行删掉，解除这行的注释） -->
    <!-- <video src="./demo.mp4" class="center-media" autoplay loop muted playsinline></video> -->

</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <title>惊喜 - LittleMimiCHEN</title>
    <style>
        /* 1. 网页全屏、深色背景、内容完美居中 */
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #1a1a1a; /* 深灰色，让彩蛋看起来更高级 */
            display: flex;
            justify-content: center; /* 水平居中 */
            align-items: center;     /* 垂直居中 */
        }
        
        /* 2. 左上角返回按钮 */
        .back-btn {
            position: absolute;
            top: 20px;
            left: 20px;
            padding: 10px 20px;
            background: rgba(255, 255, 255, 0.2);
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-family: "Microsoft YaHei", sans-serif;
            font-weight: bold;
            backdrop-filter: blur(5px);
            z-index: 999;
        }
        
        .back-btn:hover {
            background: rgba(255, 255, 255, 0.8);
            color: black;
        }

        /* 3. 控制 GIF 的大小和样式（强制锁死200px大小） */
        .center-media {
            width: 200px !important; /* 如果你觉得大，把 200 改成 150 或 120 */
            height: auto !important;
            border-radius: 10px;     /* 圆角 */
            box-shadow: 0 5px 15px rgba(255, 255, 255, 0.2); /* 悬浮的阴影效果 */
        }
    </style>
</head>
<body>

    <!-- 返回首页按钮 -->
    <a href="./index.html" class="back-btn">⬅️ 返回首页</a>

    <!-- 👇👇👇 这里用 img 标签显示 GIF 👇👇👇 -->
    <!-- ⚠️ 注意：请把你刚才生成的 GIF 重命名为 demo.gif，并传到仓库 -->
    <img src="./demo.gif" class="center-media" alt="惊喜动图">

</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <title>惊喜 - LittleMimiCHEN</title>
    <style>
        /* 1. 网页全屏、居中、深色背景 */
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #1a1a1a; /* 深灰色背景，比纯黑好看 */
            display: flex;
            justify-content: center; /* 水平居中 */
            align-items: center;     /* 垂直居中 */
        }
        
        /* 2. 左上角返回按钮 */
        .back-btn {
            position: absolute;
            top: 20px;
            left: 20px;
            padding: 10px 20px;
            background: rgba(255, 255, 255, 0.2);
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-family: "Microsoft YaHei", sans-serif;
            font-weight: bold;
            backdrop-filter: blur(5px);
            z-index: 999;
            transition: 0.3s;
        }
        
        .back-btn:hover {
            background: rgba(255, 255, 255, 0.8);
            color: black;
        }

        /* 3. 图片样式（死锁150px大小） */
        .center-gif {
            width: 150px !important; /* 强制锁死宽度 */
            height: auto !important;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(255, 255, 255, 0.2); /* 一点发光阴影 */
        }
    </style>
</head>
<body>

    <!-- 返回按钮 -->
    <a href="./index.html" class="back-btn">⬅️ 返回首页</a>

    <!-- 居中的图片（代码里用的是 videogif.gif） -->
    <img src="./videogif.gif" class="center-gif" alt="惊喜动图">

</body>
</html>

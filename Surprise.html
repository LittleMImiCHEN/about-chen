<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <title>惊喜 - LittleMimiCHEN</title>
    <style>
        /* 1. 网页全屏、深色背景、内容居中 */
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #1a1a1a; /* 深灰色背景 */
            display: flex;
            justify-content: center; /* 水平居中 */
            align-items: center;     /* 垂直居中 */
        }
        
        /* 2. 左上角返回按钮 */
        .back-btn {
            position: absolute;
            top: 20px;
            left: 20px;
            padding: 10px 20px;
            background: rgba(255, 255, 255, 0.2);
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-family: "Microsoft YaHei", sans-serif;
            font-weight: bold;
            backdrop-filter: blur(5px);
            z-index: 999;
        }
        
        .back-btn:hover {
            background: rgba(255, 255, 255, 0.8);
            color: black;
        }

        /* 3. 控制视频的大小和样式 */
        .center-media {
            width: 200px !important; /* 强制锁死宽度为200像素，想改大就改这个数字 */
            height: auto !important;
            border-radius: 10px;     /* 圆角 */
            box-shadow: 0 5px 15px rgba(255, 255, 255, 0.2); /* 发光阴影 */
        }
    </style>
</head>
<body>

    <!-- 返回首页按钮 -->
    <a href="./index.html" class="back-btn">⬅️ 返回首页</a>

    <!-- 👇 这里用的是视频标签，播放 video.mp4 👇 -->
    <video src="./video.mp4" class="center-media" autoplay loop muted playsinline></video>

</body>
</html>

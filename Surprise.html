<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <title>惊喜 - LittleMimiCHEN</title>
    <style>
        /* 1. 网页基础设置：黑底、消除边距、内容完全居中 */
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000; /* 纯黑背景 */
            display: flex;          /* 开启弹性布局 */
            justify-content: center;/* 水平居中 */
            align-items: center;    /* 垂直居中 */
        }

        /* 2. 控制 GIF 的大小和样式 */
        .center-gif {
            /* 宽度占屏幕的 70%，最大不超过 500px。
               手机上看就是屏幕70%大小，电脑上看最大500px。 */
            width: 70%; 
            max-width: 500px; 
            
            /* 高度自动按比例缩放，不会变形 */
            height: auto; 
            
            border-radius: 15px; /* 圆角 */
            box-shadow: 0 10px 30px rgba(255, 255, 255, 0.2); /* 加一点白色发光阴影，很酷 */
        }

        /* 3. 左上角“返回首页”按钮样式 */
        .back-btn {
            position: absolute;
            top: 20px;
            left: 20px;
            padding: 10px 20px;
            background: rgba(255, 255, 255, 0.2);
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-family: "Microsoft YaHei", sans-serif;
            font-weight: bold;
            backdrop-filter: blur(5px);
            z-index: 999;
            transition: 0.3s;
        }
        
        .back-btn:hover {
            background: rgba(255, 255, 255, 0.8);
            color: black;
        }
    </style>
</head>
<body>

    <!-- 返回首页按钮 -->
    <a href="./index.html" class="back-btn">⬅️ 返回首页</a>

    <!-- 居中的 GIF 动图 -->
    <!-- 代码里的名字依然是你之前传的 videogif.gif -->
    <img src="./videogif.gif" class="center-gif" alt="惊喜动图">

</body>
</html>
